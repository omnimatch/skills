  color-scheme: dark;
  --background: #0d1020;
  --surface: #15192b;
  --raised: #1d2239;
  --foreground: #f4f2ec;
  --muted: #b0aec3;
  --accent: #c3afff;
  --accent-soft: #29223f;
  --border: #30354c;
  --grid: #343a52;
  --success: #8ee4bd;
  --warning: #f5ca87;
  font-family:
    "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-size: 14px;
  line-height: 1.55;
}
button,
input,
select {
  font: inherit;
}
button,
a,
input,
select,
summary {
  -webkit-tap-highlight-color: transparent;
}
button,
a,
summary {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
button,
a,
summary,
input,
select {
  outline-offset: 4px;
}
button:focus-visible,
a:focus-visible,
summary:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--accent);
}
::selection {
  background: var(--accent);
  color: var(--background);
}
input {
  caret-color: var(--accent);
}
* {
  scrollbar-width: thin;
  scrollbar-color: #58536f transparent;
}
a {
  color: inherit;
  text-decoration: none;
  text-underline-offset: 4px;
}
a:hover {
  text-decoration: underline;
}
button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 8px 12px;
  background: transparent;
  color: var(--foreground);
  border: 0;
  border-radius: 7px;
}
button:hover {
  background: var(--raised);
}
button svg,
a svg {
  flex-shrink: 0;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: clamp(2rem, 3.5vw, 3.1rem);
  line-height: 1.13;
  font-weight: 550;
  letter-spacing: -0.035em;
  text-wrap: balance;
  max-width: 24ch;
}
h2 {
  font-size: 17px;
  font-weight: 550;
  line-height: 1.35;
  letter-spacing: -0.02em;
}
h3 {
  font-size: 15px;
  font-weight: 600;
}
strong {
  font-weight: 550;
}
.report-shell {
  max-width: 1380px;
  margin: auto;
  padding: 0 56px;
}
.masthead {
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  gap: 20px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  font-size: 20px;
  line-height: 1.3;
  font-weight: 550;
  letter-spacing: -0.025em;
}
.brand:hover {
  text-decoration: none;
}
.brand-mark {
  width: 31px;
  height: 31px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--accent);
}
.brand-mark span {
  width: 14px;
  height: 14px;
  border: 2px solid var(--background);
  border-top-color: transparent;
  border-radius: 50%;
  transform: rotate(-35deg);
}
.byline {
  display: block;
  font-size: 11px;
  letter-spacing: 0;
  font-weight: 400;
  color: var(--muted);
  margin-top: 1px;
}
.report-actions {
  display: flex;
  align-items: center;
  gap: 22px;
}
.status {
  display: flex;
  gap: 8px;
  align-items: center;
  color: var(--success);
  font-size: 12px;
}
.status > span {
  height: 6px;
  width: 6px;
  border-radius: 50%;
  background: currentColor;
}
.status.partial {
  color: var(--warning);
}
.demo-notice {
  color: var(--warning);
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.report-intro {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 60px;
  padding: 43px 0 32px;
  align-items: end;
}
.brief {
  max-width: 75ch;
  color: var(--muted);
  margin-top: 17px;
  line-height: 1.7;
}
.report-meta {
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 17px;
  min-width: 130px;
}
.report-meta dt {
  font-size: 11px;
  color: var(--muted);
}
.report-meta dd {
  margin: 3px 0 0;
  font-size: 13px;
}
.pause-notice {
  color: var(--warning);
  padding: 12px 0;
  max-width: 75ch;
}
.collections {
  display: flex;
  gap: 26px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  padding-top: 7px;
}
.collections button {
  border-radius: 0;
  padding: 12px 0 15px;
  position: relative;
  color: var(--muted);
  gap: 10px;
  white-space: nowrap;
}
.collections button:hover {
  background: none;
  color: var(--foreground);
}
.collections button[aria-pressed="true"] {
  color: var(--foreground);
}
.collections button[aria-pressed="true"]:after {
  content: "";
  position: absolute;
  height: 2px;
  background: var(--accent);
  bottom: 0;
  left: 0;
  right: 0;
}
.collections button span {
  color: var(--muted);
  font-size: 12px;
}
.research-toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 22px 0;
}
.search-field {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  color: var(--muted);
  min-width: 180px;
}
.search-field input {
  width: 100%;
  background: transparent;
  border: 0;
  color: var(--foreground);
  min-height: 42px;
  padding: 6px 0;
  outline-offset: 3px;
}
.search-field input::placeholder {
  color: var(--muted);
}
select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--foreground);
  padding: 9px 26px 9px 12px;
  max-width: 100%;
  min-height: 42px;
}
.research-toolbar > button {
  padding-right: 0;
}
.research-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 50px;
  align-items: start;
  padding: 8px 0 35px;
}
.plot-column {
  min-width: 0;
}
.plot-heading,
.results-heading {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
}
.plot-heading > span,
.results-heading > span {
  font-size: 12px;
  color: var(--muted);
}
.radar {
  display: block;
  width: 100%;
  max-width: 560px;
  margin: 8px auto -8px;
  overflow: visible;
}
.axis-label {
  fill: var(--muted);
  font-size: 16px;
  letter-spacing: -0.01em;
}
.radar-selection {
  animation: radar-arrival 0.45s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes radar-arrival {
  from {
    opacity: 0.35;
    filter: blur(2px);
  }
  to {
    opacity: 1;
    filter: blur(0);
  }
}
.plot-legend {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--muted);
  padding-bottom: 27px;
}
.plot-legend > span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.plot-legend i {
  width: 15px;
  height: 2px;
  background: var(--accent);
  display: inline-block;
}
.plot-legend > span:nth-child(2) i {
  opacity: 0.25;
}
.plot-legend > span:last-child {
  margin-left: auto;
}
.selected-detail {
  border-top: 1px solid var(--border);
  padding-top: 24px;
}
.detail-heading {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  align-items: center;
}
.detail-heading h2 {
  scroll-margin-top: 24px;
  font-size: 23px;
  margin-top: 6px;
  overflow-wrap: anywhere;
}
.detail-heading h2:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 6px;
}
.source-domain {
  color: var(--muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.source-action {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 42px;
  min-height: 42px;
  border-radius: 7px;
  color: var(--accent);
}
.source-action:hover {
  background: var(--raised);
}
.score-summary {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  align-items: baseline;
  margin: 17px 0 20px;
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.score-summary strong {
  color: var(--foreground);
  font-size: 29px;
  font-weight: 450;
  letter-spacing: -0.03em;
}
.criterion-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.criterion-table th {
  font-weight: 400;
  text-align: left;
}
.criterion-table td {
  text-align: right;
}
.criterion-table thead {
  color: var(--muted);
  font-size: 11px;
}
.criterion-table td,
.criterion-table th {
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
}
.criterion-table thead th:last-child {
  text-align: right;
}
.required-mark {
  font-size: 10px;
  margin-left: 8px;
  color: var(--muted);
}
.unknown {
  color: var(--muted);
}
.score-caption {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.65;
  margin-top: 13px;
  max-width: 70ch;
}
.evidence-note {
  color: var(--warning);
  font-size: 12px;
  margin-top: 10px;
}
.evidence-panel {
  margin-top: 20px;
  border-top: 1px solid var(--border);
}
summary {
  cursor: pointer;
  padding: 17px 0;
  color: var(--foreground);
  font-size: 13px;
}
summary > span {
  color: var(--muted);
  font-size: 11px;
  margin-left: 10px;
}
.evidence-scroll {
  max-height: 360px;
  overflow: auto;
  padding-right: 12px;
}
.evidence-scroll section {
  padding-bottom: 22px;
}
.evidence-scroll a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--accent);
  overflow-wrap: anywhere;
}
.evidence-scroll a svg {
  width: 13px;
}
.evidence-date {
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
}
.evidence-text {
  white-space: pre-wrap;
  font-size: 13px;
  line-height: 1.8;
  margin-top: 15px;
  overflow-wrap: anywhere;
  max-width: 75ch;
}
.results-column {
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 13px;
  overflow: hidden;
  background: var(--surface);
}
.results-heading {
  padding: 21px 22px 17px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.result-list {
  max-height: 650px;
  overflow: auto;
  overscroll-behavior: contain;
  padding: 0 10px;
}
.result-row {
  display: flex;
  text-align: left;
  width: 100%;
  padding: 17px 12px;
  border-radius: 0;
  gap: 13px;
  border-bottom: 1px solid var(--border);
  min-height: 104px;
  transition: background 0.15s;
}
.result-row:last-child {
  border-bottom: 0;
}
.result-row:hover {
  background: var(--raised);
}
.result-row[aria-pressed="true"] {
  background: var(--accent-soft);
}
.result-index {
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  align-self: flex-start;
  padding-top: 3px;
}
.result-copy {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}
.result-copy strong {
  font-size: 14px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.result-copy > span {
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
  overflow-wrap: anywhere;
}
.result-copy small {
  color: var(--muted);
  font-size: 10px;
  margin-top: 5px;
}
.result-score {
  color: var(--foreground);
  font-size: 25px;
  font-weight: 450;
  line-height: 1.15;
  letter-spacing: -0.025em;
  text-align: right;
  min-width: 33px;
  font-variant-numeric: tabular-nums;
}
.result-score small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0;
  margin-top: 3px;
}
.result-row > svg {
  color: var(--muted);
  width: 14px;
  margin-left: 2px;
}
.result-row[aria-pressed="true"] > svg {
  color: var(--accent);
}
.list-footnote {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
  border-top: 1px solid var(--border);
  padding: 14px 22px;
}
.load-more {
  display: flex;
  width: 100%;
  margin: 10px 0;
  color: var(--accent);
}
.empty-state {
  border-top: 1px solid var(--border);
  padding: 35px 0;
  min-height: 200px;
}
.empty-state p,
.list-empty {
  color: var(--muted);
  margin-top: 9px;
}
.list-empty {
  padding: 30px 15px;
}
.research-log {
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin-top: 10px;
}
.research-log summary {
  padding: 22px 0;
}
.log-content {
  max-width: 85ch;
  padding: 2px 0 30px;
}
.log-content h3 {
  margin: 22px 0 9px;
}
.log-content p {
  color: var(--muted);
  max-width: 75ch;
  font-size: 13px;
}
.log-content ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
.log-content li {
  display: flex;
  gap: 30px;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
  font-size: 12px;
}
.log-content li > span:last-child {
  color: var(--muted);
  text-align: right;
  max-width: 40%;
}
footer {
  padding: 25px 0 32px;
  display: flex;
  justify-content: space-between;
  gap: 24px;
  color: var(--muted);
  font-size: 11px;
}
footer a {
  display: inline-flex;
  gap: 8px;
  align-items: center;
}
footer a svg {
  width: 12px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}
@media (min-width: 1400px) {
  .result-list {
    max-height: 720px;
  }
}
@media (max-width: 1000px) {
  .report-shell {
    padding: 0 30px;
  }
  .research-layout {
    gap: 28px;
  }
  .research-toolbar {
    flex-wrap: wrap;
  }
  .search-field {
    flex-basis: 100%;
  }
  .research-toolbar > button {
    margin-left: auto;
  }
  .report-intro {
    gap: 30px;
  }
  .plot-heading {
    flex-wrap: wrap;
    gap: 5px;
  }
  .result-row {
    gap: 9px;
    padding: 15px 6px;
  }
  .result-row > svg {
    display: none;
  }
}
@media (max-width: 700px) {
  .report-shell {
    padding: 0 20px;
  }
  .masthead {
    height: 82px;
  }
  .report-actions {
    gap: 12px;
  }
  .report-actions .status {
    display: none;
  }
  .report-intro {
    display: block;
    padding-top: 30px;
  }
  .report-meta {
    flex-direction: row;
    margin-top: 22px;
    gap: 35px;
  }
  .collections {
    gap: 23px;
  }
  .research-layout {
    display: flex;
    flex-direction: column;
    gap: 27px;
  }
  .plot-column,
  .results-column {
    width: 100%;
  }
  .results-column {
    order: -1;
  }
  .result-list {
    max-height: 320px;
  }
  .result-row {
    min-height: 84px;
    padding: 13px 8px;
  }
  .results-heading {
    padding: 16px 18px;
  }
  .plot-heading {
    flex-wrap: nowrap;
  }
  .plot-legend {
    gap: 10px;
  }
  .plot-legend > span:last-child {
    margin-left: 0;
    flex-basis: 100%;
  }
  .radar {
    max-width: 420px;
  }
  .research-toolbar {
    gap: 9px;
    padding: 16px 0;
  }
  .select-field {
    flex: 1;
    min-width: 0;
  }
  select {
    width: 100%;
    font-size: 12px;
    padding-left: 8px;
  }
  .research-toolbar > button {
    padding: 8px;
  }
  .search-field input {
    font-size: 16px;
  }
  .score-summary {
    flex-wrap: wrap;
  }
  .log-content li {
    display: block;
  }
  .log-content li > span {
    display: block;
  }
  .log-content li > span:last-child {
    max-width: none;
    text-align: left;
    margin-top: 5px;
  }
  footer {
    display: block;
  }
  footer > span {
    display: block;
    margin-top: 12px;
  }
  .demo-notice {
    font-size: 11px;
  }
  h1 {
    font-size: 32px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .radar-selection {
    animation: none;
  }
  .result-row {
    transition: none;
  }
}
@media print {
  :root {
    color-scheme: light;
    --background: #fff;
    --surface: #fff;
    --raised: #f4f2f8;
    --foreground: #191724;
    --muted: #555064;
    --accent: #6541b3;
    --accent-soft: #f1eafb;
    --border: #d6d0df;
    --grid: #d6d0df;
    --success: #256449;
    --warning: #704b13;
  }
  .report-shell {
    padding: 0;
  }
  .report-actions,
  .research-toolbar {
    display: none;
  }
  .result-list,
  .evidence-scroll {
    max-height: none;
    overflow: visible;
  }
  .research-layout {
    display: block;
  }
  .plot-column,
  .results-column {
    break-inside: avoid;
    margin: 20px 0;
  }
  .collections button:not([aria-pressed="true"]) {
    display: none;
  }
  .results-column {
    border: 0;
  }
  .radar {
    max-width: 420px;
  }
  .research-log {
    break-before: page;
  }
  .brief {
    max-width: none;
  }
  footer {
    font-size: 10px;
  }
}
.collection-summary {
  max-width: 75ch;
  color: var(--muted);
  margin: 0 0 28px;
  line-height: 1.75;
}
.result-note {
  font-size: 13px;
  line-height: 1.75;
  color: var(--muted);
  margin: 0 0 20px;
  max-width: 75ch;
}
.recommended-approach {
  padding: 22px 0 30px;
  border-top: 1px solid var(--border);
}
.recommended-approach p {
  white-space: pre-wrap;
  max-width: 75ch;
  color: var(--muted);
  line-height: 1.8;
  margin-top: 12px;
}
.recommended-approach > div {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 15px;
}
.recommended-approach button {
  color: var(--accent);
  font-size: 12px;
}

.day-plan {
  margin-top: 48px;
  padding-top: 28px;
  border-top: 1px solid var(--border);
}
.itinerary-layout {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 48px;
  margin-top: 24px;
}
.itinerary-stops {
  list-style: none;
  padding: 0;
  margin: 0;
}
.itinerary-stops li {
  display: flex;
  gap: 18px;
  padding: 18px 0;
  border-bottom: 1px solid var(--border);
}
.stop-number {
  display: grid;
  place-items: center;
  flex: 0 0 28px;
  height: 28px;
  border: 1px solid var(--accent);
  border-radius: 50%;
  color: var(--accent);
}
.stop-time {
  color: var(--accent);
  font-size: 12px;
}
.itinerary-stops button {
  display: flex;
  text-align: left;
  padding: 4px 0;
  font-size: 18px;
  font-weight: 600;
}
.itinerary-stops p {
  margin: 4px 0 10px;
  color: var(--muted);
}
.itinerary-stops a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 11px;
}
.route-sketch {
  margin: 0;
}
.route-sketch svg {
  display: block;
  width: 100%;
  max-height: 320px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
}
.route-sketch text {
  fill: var(--background);
  font-size: 15px;
  font-weight: 700;
}
.route-sketch figcaption,
.route-unavailable {
  color: var(--muted);
  font-size: 12px;
  margin-top: 10px;
}
.next-action {
  color: var(--accent);
}
@media (max-width: 700px) {
  .itinerary-layout {
    grid-template-columns: 1fr;
    gap: 24px;
  }
  .select-field:last-of-type {
    flex: 1 0 100%;
    order: 3;
  }
  .research-toolbar > button {
    order: 2;
  }
}
@media print {
  .day-plan {
    break-before: page;
  }
  .itinerary-stops li,
  .route-sketch {
    break-inside: avoid;
  }
  .itinerary-stops button,
  .itinerary-stops p,
  .route-sketch figcaption {
    color: #151515;
  }
}
